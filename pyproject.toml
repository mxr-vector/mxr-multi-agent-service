[project]
name = "multi-agent-service"
version = "0.1.0"
description = "Multi-agent inference service built on FastAPI + LangGraph, featuring enterprise Agentic RAG (hybrid retrieval with jieba BM25 + dense vectors, reflection and rerank), AI diagram drawing workflow and RBAC management; model inference decoupled via HTTP to local vLLM or any OpenAI-compatible API."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "bcrypt>=5.0.0",
    "cohere>=7.0.7",
    "dashscope>=1.26.3",
    "fastapi[standard]>=0.139.0",
    "hdbscan>=0.8.40",
    "jieba>=0.42.1",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.0.4",
    "loguru>=0.7.3",
    "numpy>=2.5.1",
    "openai>=1.100.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.2.4",
    "pyjwt>=2.10.1",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.2",
    "qdrant-client[fastembed]>=1.18.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uuid-utils>=0.17.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.17.4",
]


[tool.black]
target-version = ["py313"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".venv", "multi-agent-ui", "logs", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# FastAPI 的 Body/Path/Query/Depends 依赖注入惯用写法
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# 评测脚本需先注入 sys.path / 环境变量，再导入项目模块
"utils/migrate_sparse.py" = ["E402"]
"test/dataset01/eval/*.py" = ["E402"]


# 官方 PyPI 镜像（默认国内源可选）
[[tool.uv.index]]
name = "internal-proxy"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[[tool.uv.index]]
name = "huawei"
url = "https://mirrors.huaweicloud.com/repository/pypi/simple"

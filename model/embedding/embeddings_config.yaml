configs:
  # 文本信息向量 · 云端（DashScope，OpenAI兼容协议）
  - name: text_cloud
    vector_type: text
    source: cloud
    provider: openai_compatible_text
    model_name: text-embedding-v4
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

  # 文本信息向量 · 本地
  - name: text_local
    vector_type: text
    source: local
    provider: hf_text
    model_name: Qwen/Qwen3-Embedding-0.6B
    device: auto          # 自动探测有没有GPU
    normalize: true

  # 文本信息向量 · 本地HTTP服务（自建 vLLM/TEI，同样走 OpenAI 兼容协议）
  - name: text_local_http
    vector_type: text
    source: local
    provider: openai_compatible_text
    model_name: bge-large-zh
    base_url: http://192.168.1.10:8080/v1

  # 多模态独立向量 · 云端
  - name: multimodal_independent_cloud
    vector_type: multimodal_independent
    source: cloud
    provider: dashscope_multimodal
    model_name: multimodal-embedding-v1
    api_key_env: DASHSCOPE_API_KEY

  # 多模态独立向量 · 本地（OpenCLIP）
  - name: multimodal_independent_local
    vector_type: multimodal_independent
    source: local
    provider: open_clip_local
    model_name: ViT-H-14
    extra:
      checkpoint: laion2b_s32b_b79k

  # 多模态融合向量 · 本地（GME-Qwen2-VL）
  - name: fusion_local
    vector_type: multimodal_fusion
    source: local
    provider: gme_local
    model_name: iic/gme-Qwen2-VL-2B-Instruct
    device: auto          # 自动探测有没有GPU
